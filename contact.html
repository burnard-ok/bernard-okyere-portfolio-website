    <body class="d-flex flex-column h-100 bg-engineer engineer-page">
        <main class="flex-shrink-0">
            <!-- Navigation-->
            <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
                <div class="container px-5">
                    <a class="navbar-brand site-brand" href="/" aria-label="Bernard Okyere home">

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">

                        </ul>
                    </div>
                </div>
            </nav>
            <!-- Page content-->
            <section class="py-5">
                <div class="container px-5">
                    <div class="text-center mb-5">
                        <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 mb-3"><i class="bi bi-envelope"></i></div>
                        <h1 class="display-5 fw-bolder mb-0 text-engineer-primary">Get in touch</h1>
                        <p class="lead text-muted mt-3 mb-0">Let's work together!</p>
                    </div>
                    <!-- Contact form-->
                    <div class="row gx-5 justify-content-center">
                        <div class="col-lg-11 col-xl-9 col-xxl-8">
                    <div class="bg-light rounded-4 py-5 px-4 px-md-5">
                        <div class="row gx-5 justify-content-center">
                            <div class="col-lg-9 col-xl-8">
                                <!-- * * * * * * * * * * * * * * *-->
                                <!-- * * Contact Form * *-->
                                <!-- * * * * * * * * * * * * * * *-->
                                <form action="<Google Form endpoint>" method="POST" data-contact-form data-success-target="contact-form-success">
                                    <!-- Company / Institution Input -->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="company" name="entry.111725770" type="text" placeholder=" " required />
                                        <label for="company">Affiliated Company/Institution</label>
                                    </div>

                                    <!-- Name Input -->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="name" name="entry.2003220554" type="text" placeholder=" " required />
                                        <label for="name">Your Name</label>
                                    </div>
    
                                    <!-- Email Address Input -->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="email" name="entry.1049671291" type="email" placeholder=" " required />
                                        <label for="email">Email Address</label>
                                    </div>
    
                                    <!-- Phone Number Input -->
                                    <div class="form-floating mb-3">
                                        <input class="form-control" id="phone" name="entry.116629858" type="tel" inputmode="tel" pattern="\+?[0-9][0-9 ()-]*" title="Enter a valid phone number, including an optional country code." placeholder=" " autocomplete="tel" data-phone-input required />
                                        <label for="phone">Phone Number</label>
                                    </div>
    
                                    <!-- Message Input -->
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control" id="message" name="entry.83213457160" placeholder=" " style="height: 10rem" required></textarea>
                                        <label for="message">Message</label>
                                    </div>

                                    <!-- Submit Button -->
                                    <div class="d-grid">
                                        <button class="btn btn-primary btn-lg" id="submitButton" type="submit">Submit</button>
                                    </div>
                                </form>
                                <div id="contact-form-success" class="alert alert-success mt-4 mb-0" role="status" hidden>
                                    Thank you—your message has been submitted. I will get back to you soon.
                                </div>
                            </div>
                        </div>
                    </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
